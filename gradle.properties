# Project-wide Gradle settings for the modern AAOS/mobile source build.
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8 -XX:+HeapDumpOnOutOfMemoryError
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.enableJetifier=true

# The legacy source uses resource IDs in switch statements and expects transitive R symbols.
# Keep the classic behavior while the source is being modernized.
android.nonFinalResIds=false
android.nonTransitiveRClass=false
