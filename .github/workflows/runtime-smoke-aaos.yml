name: AAOS Runtime Smoke Test

on:
  push:
    branches: [ aaos-modern ]
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle/**'
      - 'gradle.properties'
      - '.github/workflows/runtime-smoke-aaos.yml'
  workflow_dispatch:

jobs:
  launch-api32:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build, install and launch automotiveDebug on Android 12L/API 32
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 32
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            set -eux
            chmod +x gradlew
            ./gradlew --stacktrace :app:assembleAutomotiveDebug
            APK="app/build/outputs/apk/automotive/debug/app-automotive-debug.apk"
            adb install -r "$APK"
            adb shell appops set com.ast.anexplorer MANAGE_EXTERNAL_STORAGE allow || true
            adb shell pm grant com.ast.anexplorer android.permission.READ_EXTERNAL_STORAGE || true
            adb logcat -c
            adb shell am force-stop com.ast.anexplorer
            adb shell am start -W -n com.ast.anexplorer/dev.dworks.apps.anexplorer.DocumentsActivity
            sleep 8
            echo '=== PROCESS ==='
            adb shell pidof com.ast.anexplorer || true
            echo '=== TOP ACTIVITY ==='
            adb shell dumpsys activity activities | grep -E 'mResumedActivity|topResumedActivity|com.ast.anexplorer' | head -80 || true
            echo '=== RELEVANT LOGCAT ==='
            adb logcat -d -v threadtime | grep -E 'AndroidRuntime|FATAL EXCEPTION|com\.ast\.anexplorer|dev\.dworks\.apps\.anexplorer|InflateException|SecurityException|NoClassDefFoundError|NoSuchMethodError|VerifyError' | tail -300 || true
            if ! adb shell pidof com.ast.anexplorer >/dev/null; then
              echo 'AnExplorer process died after launch.' >&2
              adb logcat -d -v threadtime | tail -1000
              exit 1
            fi