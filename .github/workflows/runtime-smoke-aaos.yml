name: AAOS Runtime Smoke Test

on:
  push:
    branches: [ aaos-modern ]
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle/**'
      - 'gradle.properties'
      - '.github/scripts/aaos-smoke.sh'
      - '.github/workflows/runtime-smoke-aaos.yml'
  workflow_dispatch:

jobs:
  launch-aaos-api33:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build, install and launch on Android Automotive OS 13/API 33
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: android-automotive
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/scripts/aaos-smoke.sh
