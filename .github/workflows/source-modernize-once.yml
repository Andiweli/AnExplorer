name: Apply Source Modernization Once

on:
  push:
    branches: [ aaos-modern ]
    paths:
      - tools/modernize_source_once.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout AAOS modernization branch
        uses: actions/checkout@v4
        with:
          ref: aaos-modern
          fetch-depth: 0

      - name: Apply safe source transformations
        run: python3 tools/modernize_source_once.py

      - name: Commit transformed source
        run: |
          if git diff --quiet; then
            echo "Source already modernized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/dev/dworks/apps/anexplorer/provider/UsbStorageProvider.java
          git add app/src/main/java/dev/dworks/apps/anexplorer/provider/ExternalStorageProvider.java
          git add app/src/main/java/dev/dworks/apps/anexplorer/misc/StorageUtils.java
          git add app/src/main/java/dev/dworks/apps/anexplorer/setting/SettingsActivity.java
          git commit -m "Modernize USB, storage and settings runtime behavior"
          git push origin HEAD:aaos-modern
