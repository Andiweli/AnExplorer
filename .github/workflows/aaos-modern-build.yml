name: AAOS Modern Build

on:
  push:
    branches: [ aaos-modern ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # GitHub's current Ubuntu image already ships a complete Android SDK and sdkmanager.
      # android-actions/setup-android@v3 currently tries to install the obsolete package
      # named "tools" and fails before Gradle can run, so use the runner SDK directly.
      - name: Install Android 36 SDK
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;35.0.0"

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build mobile and automotive debug APKs
        run: ./gradlew --stacktrace :app:assembleMobileDebug :app:assembleAutomotiveDebug

      - name: Build mobile and automotive release bundles
        run: ./gradlew --stacktrace :app:bundleMobileRelease :app:bundleAutomotiveRelease

      - name: Upload debug APKs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: anexplorer-modern-debug-apks
          path: app/build/outputs/apk/**/debug/*.apk
          if-no-files-found: error

      - name: Upload unsigned release bundles
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: anexplorer-modern-release-aabs
          path: app/build/outputs/bundle/**/*.aab
          if-no-files-found: error
