plugins {
    id 'com.android.application'
}

def props = new Properties()
def keystoreProperties = rootProject.file('keystore.properties')
if (keystoreProperties.exists()) {
    keystoreProperties.withInputStream { props.load(it) }
}

def configString = { String key ->
    def value = props.getProperty(key, '')
    return '"' + value.replace('\\', '\\\\').replace('"', '\\"') + '"'
}

def keyStorePath = props.getProperty('keyStore', '')
def hasReleaseSigning = !keyStorePath.isEmpty() && rootProject.file(keyStorePath).exists()

android {
    namespace 'dev.dworks.apps.anexplorer'
    compileSdk 36

    defaultConfig {
        applicationId 'com.ast.anexplorer'
        minSdk 23
        targetSdk 36
        versionCode 60820
        versionName '6.0.8-source1'
        multiDexEnabled true
        vectorDrawables.useSupportLibrary = true

        buildConfigField 'String', 'LICENSE_KEY', configString('LICENSE_KEY')
        buildConfigField 'String', 'DROPBOX_CLIENT_ID', configString('DROPBOX_CLIENT_ID')
        buildConfigField 'String', 'DROPBOX_CLIENT_KEY', configString('DROPBOX_CLIENT_KEY')
        buildConfigField 'String', 'ONEDRIVE_CLIENT_ID', configString('ONEDRIVE_CLIENT_ID')
        buildConfigField 'String', 'ONEDRIVE_CLIENT_KEY', configString('ONEDRIVE_CLIENT_KEY')
        buildConfigField 'String', 'BOX_CLIENT_ID', configString('BOX_CLIENT_ID')
        buildConfigField 'String', 'BOX_CLIENT_KEY', configString('BOX_CLIENT_KEY')
        buildConfigField 'String', 'GOOGLE_DRIVE_CLIENT_ID', configString('GOOGLE_DRIVE_CLIENT_ID')
        buildConfigField 'String', 'PLAYSTORE_LICENSE_KEY', configString('PLAYSTORE_LICENSE_KEY')
        buildConfigField 'String', 'MERCHANT_ID', configString('MERCHANT_ID')
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    flavorDimensions 'platform'
    productFlavors {
        mobile {
            dimension 'platform'
            targetSdk 36
            versionNameSuffix '-android'
        }
        automotive {
            dimension 'platform'
            targetSdk 35
            versionNameSuffix '-aaos'
        }
    }

    sourceSets {
        mobile {
            java.srcDirs += ['src/pro/java']
            res.srcDirs += ['src/pro/res']
        }
        automotive {
            java.srcDirs += ['src/pro/java']
            res.srcDirs += ['src/pro/res']
        }
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile rootProject.file(keyStorePath)
                storePassword props.getProperty('keyStorePassword')
                keyAlias props.getProperty('keyAlias')
                keyPassword props.getProperty('keyAliasPassword')
            }
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
            shrinkResources false
        }
        release {
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    packaging {
        resources {
            excludes += ['META-INF/LICENSE', 'META-INF/LICENSE.txt', 'META-INF/NOTICE', 'META-INF/NOTICE.txt', 'META-INF/DEPENDENCIES']
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')

    implementation 'com.jaredrummler:android-processes:1.1.1'
    implementation 'com.github.mjdev:libaums:0.5.5'
    implementation 'org.apache.ftpserver:ftpserver-core:1.1.1'
    implementation 'commons-net:commons-net:3.11.1'
    implementation 'com.zsoltsafrany:needle:1.0.0'
    implementation 'com.cloudrail:cloudrail-si-android:2.22.4'

    implementation 'androidx.core:core:1.16.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.collection:collection:1.4.5'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.exifinterface:exifinterface:1.4.1'
    implementation 'androidx.vectordrawable:vectordrawable:1.2.0'
    implementation 'com.google.android.material:material:1.12.0'

    implementation 'com.github.javiersantos:AppUpdater:2.6.5'
}
